openapi: 3.1.0
info:
  title: API de planilla-sis
  version: 0.3.0-borrador
  description: 'Contrato REST para LAN (HTTP). Fechas ISO 8601 UTC, importes como cadena decimal y errores application/problem+json.

    Adaptado a DECISIONES.md (M002–M007). Las operaciones y campos sin DDL o paquete de contrato verificable se
    marcan [PROPUESTA]; no se consideran implementados.

    '
servers:
- url: http://{host}:{port}/api/v1
  variables:
    host:
      default: localhost
    port:
      default: '3000'
tags:
- name: Autenticación
- name: Administración
- name: Registros de tiempo
- name: Eventos
- name: Rutas
- name: Estados de trabajador
- name: Contratos
- name: Planillas
- name: Catálogos
paths:
  /auth/session:
    post:
      tags:
      - Autenticación
      operationId: iniciarSesion
      summary: Iniciar sesión
      security: []
      parameters:
      - name: X-Client-Type
        in: header
        required: false
        schema:
          type: string
          enum:
          - mobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/refresh:
    post:
      tags:
      - Autenticación
      operationId: renovarSesion
      summary: Rotar refresh token
      security:
      - refreshCookie: []
      - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
      - Autenticación
      operationId: cerrarSesion
      summary: Cerrar sesión
      security:
      - cookieAuth: []
        csrfToken: []
      - bearerAuth: []
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/csrf:
    get:
      tags:
      - Autenticación
      operationId: obtenerCsrf
      summary: Obtener el token CSRF de la sesión web
      description: 'B.4: la web guarda el token CSRF solo en memoria; al recargar la página lo rehidrata con este endpoint.
        Otro origen no puede leer la respuesta, así que no habilita ataques CSRF.'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                - csrf_token
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/reauth:
    post:
      tags:
      - Autenticación
      operationId: reautenticar
      summary: Emitir token de reautenticación
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/password:
    post:
      tags:
      - Autenticación
      operationId: cambiarPassword
      summary: Cambiar contraseña propia
      security:
      - cookieAuth: []
        csrfToken: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPasswordRequest'
      responses:
        '204':
          description: Operación exitosa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me:
    get:
      tags:
      - Autenticación
      operationId: obtenerPerfil
      summary: Perfil del usuario autenticado
      description: 'Para un trabajador incluye su asignación activa y vigente hoy (con la ruta y el turno acordado del
        día): la app móvil la usa para registrar el ingreso. Para otros roles, o sin asignación, asignacion_activa es null.'
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/usuarios:
    post:
      tags:
      - Administración
      operationId: crearUsuario
      summary: Crear usuario
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioCreado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo:
    get:
      tags:
      - Registros de tiempo
      operationId: listarRegistrosTiempo
      summary: Listar registros
      description: 'Cada rol ve solo lo suyo (C.2): administrador todos; supervisor los de trabajadores con asignación
        activa en una ruta suya; trabajador los propios (CU-13, también desde el móvil con Bearer). desde y hasta son
        fechas de calendario en la zona de operación (America/Guatemala). Ordenado por ingreso_at descendente.'
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: trabajador_id
        in: query
        required: false
        schema: &id002
          type: string
          format: uuid
      - name: desde
        in: query
        required: false
        schema: &id001
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        schema: *id001
      - name: estado_validacion
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EstadoValidacion'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrosTiempoPagina'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/ingreso:
    post:
      tags:
      - Registros de tiempo
      operationId: registrarIngreso
      summary: Registrar ingreso
      description: 'Solo rol trabajador. 422 ASIGNACION_NO_ACTIVA si la asignación no es propia, activa y vigente en la
        fecha local; 409 REGISTRO_ABIERTO si ya hay un ingreso sin salida; 422 SOLAPA_JORNADA_ANTERIOR si es anterior a
        la última salida; 422 FECHA_FUTURA si ingreso_at está más de 5 min adelantado; 409 CLIENT_UUID_REUTILIZADO si el
        client_uuid ya se usó con otros datos. turno se incluye si hay acuerdo ACEPTADO o CONFIRMADO para esa fecha;
        dentro_de_geocerca solo si se envía ubicacion y la ruta tiene puntos.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngresoRequest'
      responses:
        '201':
          description: Ingreso registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngresoResponse'
        '200':
          description: Reintento idéntico; se devuelve el recurso original (idempotencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngresoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/{id}/descansos:
    post:
      tags:
      - Registros de tiempo
      operationId: registrarDescanso
      summary: Registrar descanso completo
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescansoRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescansoResponse'
        '200':
          description: Reintento idéntico (mismo client_uuid); se devuelve el recurso original (idempotencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescansoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/{id}/salida:
    patch:
      tags:
      - Registros de tiempo
      operationId: registrarSalida
      summary: Registrar salida
      description: 'Solo el trabajador dueño (otro: 404). Un reintento con la misma salida_at devuelve 200; otra hora,
        409 SALIDA_YA_REGISTRADA. 409 ESTADO_INVALIDO si el registro ya fue validado; 422 RANGO_INVALIDO si no es
        posterior al ingreso; 422 DESCANSO_POSTERIOR_A_SALIDA si un descanso termina después; 422 FECHA_FUTURA.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalidaRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/{id}/validacion:
    patch:
      tags:
      - Registros de tiempo
      operationId: validarRegistroTiempo
      summary: Validar o rechazar registro
      description: 'Supervisor del trabajador o administrador (otro supervisor: 404). 409 REGISTRO_ABIERTO si la jornada
        no tiene salida; 409 ESTADO_INVALIDO si no está PENDIENTE o CORREGIDA; 422 OBSERVACIONES_REQUERIDAS al rechazar
        sin motivo. Registra APROBAR o RECHAZAR en auditoria.'
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /eventos:batch:
    post:
      tags:
      - Eventos
      operationId: sincronizarEventos
      summary: Sincronizar eventos por lote
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventosBatchRequest'
      responses:
        '207':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventosBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /rutas/{rutaId}/asignaciones:
    post:
      tags:
      - Rutas
      operationId: crearAsignacion
      summary: Asignar trabajador a ruta
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - name: rutaId
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - Rutas
      operationId: listarAsignacionesRuta
      summary: Consultar asignaciones de ruta
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: '[PROPUESTA]'
      parameters:
      - name: rutaId
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaAsignacionPagina'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /acuerdos-turno/{id}/respuesta:
    patch:
      tags:
      - Rutas
      operationId: responderAcuerdoTurno
      summary: Aceptar o rechazar turno
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcuerdoRespuestaRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcuerdoTurno'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /acuerdos-turno/{id}/confirmar:
    post:
      tags:
      - Rutas
      operationId: confirmarAcuerdoTurno
      summary: Confirmar acuerdo de turno
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcuerdoTurno'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /me/calculo:
    get:
      tags:
      - Planillas
      operationId: obtenerMiCalculo
      summary: Obtener horas propias
      security:
      - bearerAuth: []
      parameters:
      - name: desde
        in: query
        required: true
        schema: *id001
      - name: hasta
        in: query
        required: true
        schema: *id001
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiCalculoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /planillas/periodos/{periodoId}/calculo:
    get:
      tags:
      - Planillas
      operationId: obtenerCalculoPeriodo
      summary: Obtener cálculo del período
      security:
      - cookieAuth: []
      parameters:
      - name: periodoId
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculoPeriodoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /planillas/{id}/calcular:
    post:
      tags:
      - Planillas
      operationId: calcularPlanilla
      summary: Calcular planilla
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanillaCalculada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /planillas/{id}/verificar:
    post:
      tags:
      - Planillas
      operationId: verificarPlanilla
      summary: Verificar planilla
      security:
      - cookieAuth: []
        csrfToken: []
      description: 'Segregación de funciones: quien calculó no puede verificar.'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanillaVerificada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /planillas/{id}/aprobar:
    post:
      tags:
      - Planillas
      operationId: aprobarPlanilla
      summary: Aprobar planilla
      security:
      - cookieAuth: []
        csrfToken: []
      description: Exige permiso planilla.aprobar y reautenticación; el permiso no está asignado a ningún rol por
        defecto. Bloqueo de integridad y montos inmutables tras aprobación.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AprobarRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanillaAprobada'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /planillas/{id}/pagos:
    post:
      tags:
      - Planillas
      operationId: registrarPagos
      summary: Registrar pagos de planilla aprobada
      security:
      - cookieAuth: []
        csrfToken: []
      description: Reautenticación obligatoria. No persistir ni auditar el token. Rechazar pagos duplicados, modificaciones
        indebidas y montos que difieran del neto aprobado.
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ReauthToken'
