        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: psis_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: psis_refresh
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id002
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      description: Token de POST /auth/reauth. Un solo uso, 5 minutos, ligado a la sesión que lo pidió. Faltante,
        vencido, ya usado o de otra sesión = 403 REAUTENTICACION_REQUERIDA. No persistir ni registrar en auditoría.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Petición mal formada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No autenticado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Sin permiso o CSRF inválido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existe o no es visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Regla de negocio incumplida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Límite de tasa
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Cuenta bloqueada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Lote demasiado grande
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Rol:
      type: string
      enum:
      - trabajador
      - supervisor
      - administrador
    Dinero:
      type: string
      pattern: ^-?\d+\.\d{2}$
      examples:
      - '1234.50'
    FechaHoraUTC:
      type: string
      format: date-time
      description: Fecha y hora ISO 8601 normalizada a UTC
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
      required:
      - type
      - title
      - status
      - code
      - request_id
    Paginacion:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
      - page
      - page_size
      - total
    Ubicacion:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        precision_m:
          type: number
          minimum: 0
      required:
      - lat
      - lng
    Dispositivo:
      type: object
      properties:
        id:
          type: string
        app_version:
          type: string
    EstadoValidacion:
      type: string
      description: Alineado con el CHECK de registros_tiempo.estado_validacion (M004). PENDIENTE al crear; el supervisor
        pasa a APROBADA o RECHAZADA. CORREGIDA es un estado resultante de una corrección (no se envía en /validacion).
      enum:
      - PENDIENTE
      - APROBADA
      - CORREGIDA
      - RECHAZADA
    Usuario:
      type: object
      properties:
        id: *id002
        email:
          type: string
          format: email
        nombres:
          type: string
        apellidos:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        debe_cambiar_password:
          type: boolean
      required:
      - id
      - nombres
      - apellidos
      - rol
    Perfil:
      allOf:
      - $ref: '#/components/schemas/Usuario'
      - type: object
        properties:
          asignacion_activa:
            oneOf:
            - $ref: '#/components/schemas/AsignacionActiva'
            - type: 'null'
          jornada_abierta:
            description: Jornada del trabajador sin salida en el servidor (null si no hay, o si el rol no es trabajador).
              La app móvil la usa para mostrar el turno abierto aunque se haya marcado desde otro teléfono.
            type:
            - object
            - 'null'
            properties:
              id:
                type: string
                format: uuid
              ingreso_at:
                type: string
                format: date-time
            required:
            - id
            - ingreso_at
        required:
        - asignacion_activa
        - jornada_abierta
    PuntoGeocerca:
      type: object
      description: Punto de la ruta (ruta_puntos) donde se permite marcar, con su radio en metros.
      properties:
        nombre:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        radio_m:
          type: integer
      required:
      - nombre
      - latitud
      - longitud
      - radio_m
    AsignacionActiva:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type:
          - string
          - 'null'
          format: date
        ruta:
          type: object
          properties:
            id:
              type: string
              format: uuid
            codigo:
              type: string
            nombre:
              type: string
            puntos:
              description: Geocerca de la ruta. Vacía si la ruta no tiene puntos; en ese caso la app deja marcar
                y el servidor no informa dentro_de_geocerca.
              type: array
              items:
                $ref: '#/components/schemas/PuntoGeocerca'
          required:
          - id
          - codigo
          - nombre
          - puntos
        turno_hoy:
          type:
          - object
          - 'null'
          properties:
            nombre:
              type: string
            hora_inicio:
              type: string
            hora_fin:
              type: string
      required:
      - id
      - fecha_inicio
      - ruta
      - turno_hoy
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
      - email
      - password
