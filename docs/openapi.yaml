openapi: 3.1.0
info:
  title: API de planilla-sis
  version: 0.3.0-borrador
  description: 'Contrato REST para LAN (HTTP). Fechas ISO 8601 UTC, importes como cadena decimal y errores application/problem+json.

    Adaptado a DECISIONES.md (M002–M007). Las operaciones y campos sin DDL o paquete de contrato verificable se
    marcan [PROPUESTA]; no se consideran implementados.

    '
servers:
- url: http://{host}:{port}/api/v1
  variables:
    host:
      default: localhost
    port:
      default: '3000'
tags:
- name: Autenticación
- name: Administración
- name: Registros de tiempo
- name: Eventos
- name: Rutas
- name: Estados de trabajador
- name: Contratos
- name: Planillas
- name: Catálogos
paths:
  /auth/session:
    post:
      tags:
      - Autenticación
      operationId: iniciarSesion
      summary: Iniciar sesión
      description: Desde el 5.º intento fallido la cuenta se bloquea 1, 2, 4, 8 y hasta 15 minutos (423 CUENTA_BLOQUEADA
        con header Retry-After), también para correos que no existen. Si el usuario tiene contraseña temporal, el
        token solo permite GET /me, GET /auth/csrf, POST /auth/logout y POST /auth/password; el resto responde 403
        DEBE_CAMBIAR_PASSWORD. Abre una sesión con refresh token (ADR-001); la web lo recibe en la cookie psis_refresh
        (HttpOnly, SameSite=Strict, Path=/api/v1/auth) y el móvil en refresh_token.
      security: []
      parameters:
      - name: X-Client-Type
        in: header
        required: false
        schema:
          type: string
          enum:
          - mobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/refresh:
    post:
      tags:
      - Autenticación
      operationId: renovarSesion
      summary: Rotar refresh token
      description: 'Entrega un access token nuevo de la misma sesión y rota el refresh token: el anterior deja de servir.
        La web manda la cookie psis_refresh y recibe las dos cookies nuevas (el csrf_token no cambia); el móvil manda
        X-Client-Type: mobile y refresh_token en el cuerpo, y recibe ambos tokens. 401 REFRESH_INVALIDO si el refresh
        no existe, venció, la sesión se cerró o el usuario fue desactivado. 401 REFRESH_REUTILIZADO si se presenta un
        refresh ya rotado: se revocan todas las sesiones del usuario y queda en la auditoría. 409 REFRESH_CONCURRENTE
        si se rotó hace menos de 30 s (dos pestañas a la vez): la cookie nueva ya está en el navegador, así que basta
        con repetir la petición original.'
      security:
      - refreshCookie: []
      - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/logout:
    post:
      tags:
      - Autenticación
      operationId: cerrarSesion
      summary: Cerrar sesión
      description: Revoca el refresh token de la sesión y su access token deja de aceptarse (401 SESION_CERRADA). La
        web recibe las cookies borradas. POST /auth/password también revoca todas las sesiones del usuario.
      security:
      - cookieAuth: []
        csrfToken: []
      - bearerAuth: []
      responses:
        '204':
          description: Operación exitosa
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/csrf:
    get:
      tags:
      - Autenticación
      operationId: obtenerCsrf
      summary: Obtener el token CSRF de la sesión web
      description: 'B.4: la web guarda el token CSRF solo en memoria; al recargar la página lo rehidrata con este endpoint.
        Otro origen no puede leer la respuesta, así que no habilita ataques CSRF.'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                - csrf_token
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/reauth:
    post:
      tags:
      - Autenticación
      operationId: reautenticar
      summary: Emitir token de reautenticación
      description: Confirma la contraseña del usuario de la sesión y entrega un token de un solo uso, válido 5 minutos
        y solo para esta sesión, que se envía en X-Reauth-Token al aprobar una planilla o registrar pagos. Contraseña
        incorrecta = 403 PASSWORD_INCORRECTA (no 401, para no cerrar la sesión web) y cuenta como intento fallido;
        con la cuenta bloqueada = 429 DEMASIADOS_INTENTOS con Retry-After.
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /auth/password:
    post:
      tags:
      - Autenticación
      operationId: cambiarPassword
      summary: Cambiar contraseña propia
      description: 'Política (ADR-001): mínimo 12 caracteres, distinta de la actual, sin el correo y fuera de la lista
        de contraseñas comunes; si no se cumple, 422 PASSWORD_DEBIL con el motivo. Contraseña actual incorrecta = 403
        PASSWORD_INCORRECTA. Al cambiarla se quita la marca de contraseña temporal y se borra la cookie de sesión:
        hay que volver a iniciar sesión (el móvil descarta su token).'
      security:
      - cookieAuth: []
        csrfToken: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPasswordRequest'
      responses:
        '204':
          description: Operación exitosa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooMany'
  /me:
    get:
      tags:
      - Autenticación
      operationId: obtenerPerfil
      summary: Perfil del usuario autenticado
      description: 'Para un trabajador incluye su asignación activa y vigente hoy (con la ruta, los puntos de su geocerca
        y el turno acordado del día) y su jornada abierta: la app móvil los usa para registrar el ingreso y la salida.
        Para otros roles, asignacion_activa y jornada_abierta son null.'
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Perfil'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/usuarios:
    post:
      tags:
      - Administración
      operationId: crearUsuario
      summary: Crear usuario
      security:
      - cookieAuth: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioCreado'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - Administración
      operationId: listarUsuarios
      summary: Listar usuarios
      description: Solo administrador. Ordenados por apellidos. buscar compara contra nombre completo, correo y código
        de empleado (texto literal, sin comodines).
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: rol
        in: query
        schema:
          $ref: '#/components/schemas/Rol'
      - name: activo
        in: query
        schema:
          type: boolean
      - name: buscar
        in: query
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdminPagina'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/usuarios/{id}:
    get:
      tags:
      - Administración
      operationId: obtenerUsuario
      summary: Consultar un usuario
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Administración
      operationId: actualizarUsuario
      summary: Editar un usuario
      description: Solo administrador; cambia solo lo enviado y la baja es lógica (activo = false). El correo no se
        cambia. Un administrador no puede cambiar su propio rol ni darse de baja (422 OPERACION_SOBRE_SI_MISMO).
        Código de empleado o documento repetido = 409. El cambio de rol o la baja se aplican en el próximo inicio de
        sesión del usuario.
      security:
      - cookieAuth: []
        csrfToken: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarUsuarioRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /auditoria:
    get:
      tags:
      - Administración
      operationId: consultarAuditoria
      summary: Consultar la bitácora de auditoría
      description: Solo administrador (permiso auditoria.consultar). Más recientes primero. desde y hasta son fechas de
        calendario en hora de Guatemala.
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: entidad
        in: query
        schema:
          type: string
          example: perfiles
      - name: entidad_id
        in: query
        schema:
          type: string
      - name: actor_id
        in: query
        schema:
          type: string
          format: uuid
      - name: accion
        in: query
        schema:
          type: string
          enum:
          - INSERT
          - UPDATE
          - DELETE
          - VERIFICAR
          - APROBAR
          - RECHAZAR
          - PAGAR
          - LOGIN
          - EXPORT
      - name: desde
        in: query
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoriaPagina'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /registros-tiempo:
    get:
      tags:
      - Registros de tiempo
      operationId: listarRegistrosTiempo
      summary: Listar registros
      description: 'Cada rol ve solo lo suyo (C.2): administrador todos; supervisor los de trabajadores con asignación
        activa en una ruta suya; trabajador los propios (CU-13, también desde el móvil con Bearer). desde y hasta son
        fechas de calendario en la zona de operación (America/Guatemala). Ordenado por ingreso_at descendente.'
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: trabajador_id
        in: query
        required: false
        schema: &id002
          type: string
          format: uuid
      - name: desde
        in: query
        required: false
        schema: &id001
          type: string
          format: date
      - name: hasta
        in: query
        required: false
        schema: *id001
      - name: estado_validacion
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EstadoValidacion'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrosTiempoPagina'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/ingreso:
    post:
      tags:
      - Registros de tiempo
      operationId: registrarIngreso
      summary: Registrar ingreso
      description: 'Solo rol trabajador. 422 ASIGNACION_NO_ACTIVA si la asignación no es propia, activa y vigente en la
        fecha local; 409 REGISTRO_ABIERTO si ya hay un ingreso sin salida; 422 SOLAPA_JORNADA_ANTERIOR si es anterior a
        la última salida; 422 FECHA_FUTURA si ingreso_at está más de 5 min adelantado; 409 CLIENT_UUID_REUTILIZADO si el
        client_uuid ya se usó con otros datos. turno se incluye si hay acuerdo ACEPTADO o CONFIRMADO para esa fecha;
        dentro_de_geocerca solo si se envía ubicacion y la ruta tiene puntos.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngresoRequest'
      responses:
        '201':
          description: Ingreso registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngresoResponse'
        '200':
          description: Reintento idéntico; se devuelve el recurso original (idempotencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngresoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/{id}/descansos:
    post:
      tags:
      - Registros de tiempo
      operationId: registrarDescanso
      summary: Registrar descanso completo
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescansoRequest'
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescansoResponse'
        '200':
          description: Reintento idéntico (mismo client_uuid); se devuelve el recurso original (idempotencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescansoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/{id}/salida:
    patch:
      tags:
      - Registros de tiempo
      operationId: registrarSalida
      summary: Registrar salida
      description: 'Solo el trabajador dueño (otro: 404). Un reintento con la misma salida_at devuelve 200; otra hora,
        409 SALIDA_YA_REGISTRADA. 409 ESTADO_INVALIDO si el registro ya fue validado; 422 RANGO_INVALIDO si no es
        posterior al ingreso; 422 DESCANSO_POSTERIOR_A_SALIDA si un descanso termina después; 422 FECHA_FUTURA.'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalidaRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalidaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /registros-tiempo/{id}/validacion:
    patch:
      tags:
      - Registros de tiempo
      operationId: validarRegistroTiempo
      summary: Validar o rechazar registro
      description: 'Supervisor del trabajador o administrador (otro supervisor: 404). 409 REGISTRO_ABIERTO si la jornada
        no tiene salida; 409 ESTADO_INVALIDO si no está PENDIENTE o CORREGIDA; 422 OBSERVACIONES_REQUERIDAS al rechazar
        sin motivo. Registra APROBAR o RECHAZAR en auditoria.'
      security:
      - cookieAuth: []
        csrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacionRequest'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /eventos:batch:
    post:
      tags:
      - Eventos
      operationId: sincronizarEventos
      summary: Sincronizar eventos por lote
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventosBatchRequest'
      responses:
        '207':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventosBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /eventos:
    get:
      tags:
      - Eventos
      operationId: listarEventos
      summary: Consultar eventos (emergencias y otros)
      description: El trabajador ve los suyos; el supervisor, los de sus trabajadores; el administrador, todos (RLS de
        M008). Primero los que esperan atención, y dentro de cada grupo los más recientes.
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: estado_atencion
        in: query
        schema:
          type: string
          enum:
          - PENDIENTE_REVISION
          - EN_ATENCION
          - ATENDIDO
          - DESCARTADO
      - name: tipo_evento
        in: query
        schema:
          type: string
          enum:
          - EMERGENCIA
          - VISITA_FALLIDA
          - PROBLEMA_VEHICULO
          - CAMBIO_ESTADO
          - NOTA
          - OTRO
      - name: trabajador_id
        in: query
        schema: *id002
      - name: desde
        in: query
        schema: *id001
      - name: hasta
        in: query
        schema: *id001
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoDiarioPagina'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /eventos/{id}/atencion:
    patch:
      tags:
      - Eventos
      operationId: atenderEvento
      summary: Registrar la atención de un evento
      description: 'Supervisor del trabajador o administrador (otro = 404). PENDIENTE_REVISION -> EN_ATENCION -> ATENDIDO
        o DESCARTADO (también directo desde PENDIENTE_REVISION); ATENDIDO y DESCARTADO son finales (409
        TRANSICION_INVALIDA). Guarda quién y cuándo, y queda en la auditoría.'
      security:
      - cookieAuth: []
        csrfToken: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
