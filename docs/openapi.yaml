        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: psis_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: psis_refresh
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id002
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      description: No persistir ni registrar en auditoría en texto plano.
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Petición mal formada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No autenticado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Sin permiso o CSRF inválido
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No existe o no es visible
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto de estado
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Regla de negocio incumplida
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Límite de tasa
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: Cuenta bloqueada
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Lote demasiado grande
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Rol:
      type: string
      enum:
      - trabajador
      - supervisor
      - administrador
    Dinero:
      type: string
      pattern: ^-?\d+\.\d{2}$
      examples:
      - '1234.50'
    FechaHoraUTC:
      type: string
      format: date-time
      description: Fecha y hora ISO 8601 normalizada a UTC
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
      required:
      - type
      - title
      - status
      - code
      - request_id
    Paginacion:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
      - page
      - page_size
      - total
    Ubicacion:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        precision_m:
          type: number
          minimum: 0
      required:
      - lat
      - lng
    Dispositivo:
      type: object
      properties:
        id:
          type: string
        app_version:
          type: string
    EstadoValidacion:
      type: string
      description: Alineado con el CHECK de registros_tiempo.estado_validacion (M004). PENDIENTE al crear; el supervisor
        pasa a APROBADA o RECHAZADA. CORREGIDA es un estado resultante de una corrección (no se envía en /validacion).
      enum:
      - PENDIENTE
      - APROBADA
      - CORREGIDA
      - RECHAZADA
    Usuario:
      type: object
      properties:
        id: *id002
        email:
          type: string
          format: email
        nombres:
          type: string
        apellidos:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        debe_cambiar_password:
          type: boolean
      required:
      - id
      - nombres
      - apellidos
      - rol
    Perfil:
      allOf:
      - $ref: '#/components/schemas/Usuario'
      - type: object
        properties:
          asignacion_activa:
            oneOf:
            - $ref: '#/components/schemas/AsignacionActiva'
            - type: 'null'
        required:
        - asignacion_activa
    AsignacionActiva:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fecha_inicio:
          type: string
          format: date
        fecha_fin:
          type:
          - string
          - 'null'
          format: date
        ruta:
          type: object
          properties:
            id:
              type: string
              format: uuid
            codigo:
              type: string
            nombre:
              type: string
          required:
          - id
          - codigo
          - nombre
        turno_hoy:
          type:
          - object
          - 'null'
          properties:
            nombre:
              type: string
            hora_inicio:
              type: string
            hora_fin:
              type: string
      required:
      - id
      - fecha_inicio
      - ruta
      - turno_hoy
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
      - email
      - password
    SesionResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Usuario'
        csrf_token:
          type: string
          description: Solo web
        access_token:
          type: string
          description: Solo móvil
        refresh_token:
          type: string
          description: Solo móvil
        expira_en:
          type: integer
      required:
      - user
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Solo móvil
    RefreshResponse:
      type: object
      properties:
        access_token_emitido:
          type: boolean
        expira_en:
          type: integer
        access_token:
          type: string
          description: Solo móvil
        refresh_token:
          type: string
          description: Solo móvil
      required:
      - access_token_emitido
      - expira_en
    ReauthRequest:
      type: object
      properties:
        password:
          type: string
          format: password
      required:
      - password
    ReauthResponse:
      type: object
      properties:
        reauth_token:
          type: string
        expira_en:
          type: integer
      required:
      - reauth_token
      - expira_en
    CambioPasswordRequest:
      type: object
      properties:
        password_actual:
          type: string
          format: password
        password_nueva:
          type: string
          format: password
          minLength: 12
      required:
      - password_actual
      - password_nueva
    CrearUsuarioRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        nombres:
          type: string
        apellidos:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        codigo_empleado:
          type: string
          maxLength: 50
        documento:
          type: string
          maxLength: 50
      required:
      - email
      - nombres
      - apellidos
      - rol
      - codigo_empleado
      - documento
      description: 'codigo_empleado y documento son obligatorios y únicos (perfiles, M002). El correo se guarda en
        minúsculas. 409 con code EMAIL_DUPLICADO, CODIGO_EMPLEADO_DUPLICADO o DOCUMENTO_DUPLICADO.'
    UsuarioCreado:
      type: object
      properties:
        id: *id002
        email:
          type: string
          format: email
        password_temporal:
          type: string
        debe_cambiar_password:
          type: boolean
      required:
      - id
      - email
      - password_temporal
      - debe_cambiar_password
    IngresoRequest:
      type: object
      properties:
        client_uuid: *id002
        asignacion_id: *id002
        ingreso_at: &id003
          $ref: '#/components/schemas/FechaHoraUTC'
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        dispositivo:
          $ref: '#/components/schemas/Dispositivo'
      required:
      - client_uuid
      - asignacion_id
      - ingreso_at
    IngresoResponse:
      type: object
      properties:
        id: *id002
        estado_validacion:
          $ref: '#/components/schemas/EstadoValidacion'
        dentro_de_geocerca:
          type: boolean
        turno:
          type: object
          properties:
            nombre:
              type: string
            hora_inicio:
              type: string
            hora_fin:
              type: string
      required:
      - id
      - estado_validacion
    DescansoRequest:
      type: object
      properties:
        client_uuid: *id002
        tipo_id:
          type: integer
        inicio_at: *id003
        fin_at: *id003
      required:
      - client_uuid
      - tipo_id
      - inicio_at
      - fin_at
    DescansoResponse:
      type: object
      properties:
        id: *id002
        registro_tiempo_id: *id002
        inicio_at: *id003
        fin_at: *id003
      required:
      - id
      - registro_tiempo_id
      - inicio_at
      - fin_at
    SalidaRequest:
      type: object
      properties:
        salida_at: *id003
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        dispositivo:
          $ref: '#/components/schemas/Dispositivo'
      required:
      - salida_at
    SalidaResponse:
      type: object
      properties:
        id: *id002
        salida_at: *id003
        estado_validacion:
          $ref: '#/components/schemas/EstadoValidacion'
      required:
      - id
      - salida_at
      - estado_validacion
    RegistroTiempoResumen:
      type: object
      properties:
        id: *id002
        trabajador_id: *id002
        asignacion_id: *id002
        ingreso_at: *id003
        salida_at:
          type:
          - string
          - 'null'
          format: date-time
        estado_validacion:
          $ref: '#/components/schemas/EstadoValidacion'
        validado_por:
